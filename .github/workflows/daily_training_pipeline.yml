name: Daily Model Training Pipeline

on:
  schedule:
    # Runs once a day at midnight UTC (05:00 AM Karachi Time)
    - cron: '0 0 * * *'
  # Allows manual execution from the GitHub Actions tab anytime
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  retrain-models:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install MLOps Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Model Retraining Loop
        env:
          # Injects your secured connection string to pull from 'processed_features'
          MONGODB_URI: ${{ secrets.MONGO_CONNECTION_STRING }}
        run: |
          echo "📥 Pulling data from Feature Store via load_data.py..."
          python training_pipeline/load_data.py
          
          echo "🤖 Training Random Forest Regressor..."
          python training_pipeline/train_random_forest.py
          
          echo "📉 Training Ridge Regressor..."
          python training_pipeline/train_ridge.py
          
          echo "⚡ Training XGBoost Regressor..."
          python training_pipeline/train_xgboost.py
          
          echo "📊 Evaluating model performance metrics..."
          python training_pipeline/evaluate.py