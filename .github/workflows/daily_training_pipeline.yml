name: Daily Model Training Pipeline

on:
  schedule:
    - cron: '0 0 * * *'   # midnight UTC = 05:00 PKT
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MONGODB_URI: ${{ secrets.MONGO_CONNECTION_STRING }}    # FIX: was secrets.MONGO_CONNECTION_STRING
  PYTHONPATH: "training_pipeline"

jobs:
  retrain-models:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'    # FIX: was 3.10 — use 3.11 to match load_data.py type hints (X | None syntax)
          cache: 'pip'

      - name: Install MLOps Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Phase 0: Single MongoDB fetch → write Parquet snapshots to runner disk.
      # Subsequent steps load from Parquet (microseconds) instead of Atlas (seconds).
      - name: "Phase 0: Fetch Feature Store → Parquet Cache"
        run: |
          python run_training_pipeline.py

      # FIX: Cache step must come AFTER the step that writes the files, not before.
      # Moved from between Phase 0 and Phase 1 to after Phase 0 completes.
      - name: Cache Phase-0 Parquet Snapshots
        uses: actions/cache@v4
        with:
          path: training_pipeline/_parquet_cache
          key: parquet-cache-${{ github.run_id }}
          restore-keys: parquet-cache-

      - name: "Phase 1: Train Random Forest Models (All Horizons)"
        working-directory: ./training_pipeline
        run: |
          python train_random_forest.py

      - name: "Phase 2: Train XGBoost Models (All Horizons)"
        working-directory: ./training_pipeline
        run: |
          python train_xgboost.py

      - name: "Phase 3: Train Ridge / ElasticNet Models (All Horizons)"
        working-directory: ./training_pipeline
        run: |
          python train_ridge.py

      - name: "Phase 4: Cross-Model Evaluation → MongoDB pipeline_runs"
        working-directory: ./training_pipeline
        run: |
          python evaluate.py

      # No artifact upload step — all models, metrics, predictions, SHAP values
      # and residuals are stored in MongoDB Atlas by the training scripts.