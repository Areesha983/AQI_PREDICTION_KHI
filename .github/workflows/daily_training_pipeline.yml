name: Daily Model Training Pipeline

on:
  schedule:
    # Runs once a day at midnight UTC (05:00 AM Karachi Time)
    - cron: '0 0 * * *'
  # Allows manual execution from the GitHub Actions tab anytime
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MONGODB_URI: ${{ secrets.MONGO_CONNECTION_STRING }}
  PYTHONPATH: "training_pipeline"

jobs:
  retrain-models:
    runs-on: ubuntu-latest
    # Fail-safe protection: Prevents actions from hanging for hours if an external link stalls
    timeout-minutes: 15
    
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install MLOps Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏁 Phase 0: Fetch Feature Store and Warmup Workspace Cache
        run: |
          python run_training_pipeline.py

      - name: 🌲 Phase 1: Train Random Forest Models (All Horizons)
        working-directory: ./training_pipeline
        run: |
          python train_random_forest.py

      - name: 🚀 Phase 2: Train XGBoost Models (All Horizons)
        working-directory: ./training_pipeline
        run: |
          python train_xgboost.py

      - name: 📊 Phase 3: Train Ridge Regression Models (All Horizons)
        working-directory: ./training_pipeline
        run: |
          python train_ridge.py

      - name: 📈 Phase 4: Run Cross-Model MLOps Evaluation & Upload Metrics
        working-directory: ./training_pipeline
        run: |
          python evaluate.py