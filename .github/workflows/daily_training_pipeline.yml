name: Daily Model Training Pipeline

on:
  schedule:
    # Runs once a day at midnight UTC (05:00 AM Karachi Time)
    - cron: '0 0 * * *'
  # Allows manual execution from the GitHub Actions tab anytime
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  retrain-models:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install MLOps Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Model Retraining Loop
        env:
          MONGODB_URI: ${{ secrets.MONGO_CONNECTION_STRING }}
          # Declaring PYTHONPATH natively in the env block forces it into the runner environment flawlessly
          PYTHONPATH: ".:training_pipeline"
        run: |
          echo "🤖 Starting the master training pipeline wrapper..."
          python run_training_pipeline.py

      - name: Evaluate Model Performance Metrics
        env:
          MONGODB_URI: ${{ secrets.MONGO_CONNECTION_STRING }}
          # Declaring PYTHONPATH natively here as well to fix evaluate.py imports
          PYTHONPATH: ".:training_pipeline"
        run: |
          echo "📊 Evaluating model performance metrics..."
          python training_pipeline/evaluate.py