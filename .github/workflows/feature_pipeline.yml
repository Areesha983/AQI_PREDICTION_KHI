name: Hourly Feature Pipeline

on:
  schedule:
    # Runs at the top of every hour (00:00, 01:00, etc.)
    - cron: '0 * * * *'
  # Allows you to trigger the pipeline manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Upgraded to match the 3.10 standard in load_data.py
          cache: 'pip'          # Enables automated caching to speed up subsequent workflow runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Feature Pipeline
        env:
          # Securely injects your GitHub secret into the environment variable expected by load_data.py
          MONGODB_URI: ${{ secrets.MONGO_CONNECTION_STRING }}
        run: |
          # Calls the entry point script to update the cloud MongoDB feature store
          python run_feature_pipeline.py