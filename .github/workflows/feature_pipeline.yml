name: Hourly Feature Pipeline

on:
  schedule:
    # Runs at the top of every hour (00:00, 01:00, etc.)
    - cron: '0 * * * *'
  # Allows you to trigger the pipeline manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Feature Pipeline
        env:
          # This pulls the connection string you saved in GitHub Secrets
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          # This calls the entry point script you created in your root directory
          python run_feature_pipeline.py