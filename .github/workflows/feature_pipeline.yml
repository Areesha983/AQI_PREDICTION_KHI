name: Hourly Feature Pipeline

on:
  schedule:
    # Runs at the top of every hour (00:00, 01:00, etc.)
    - cron: '0 * * * *'
  # Allows you to trigger the pipeline manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 3.11 required for X | None union type hint syntax in load_data.py
          cache: 'pip'           # Enables automated caching to speed up subsequent workflow runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── SLOW PATH: historical catch-up + feature engineering ─────────────────
      # Writes to `processed_features` (training data).
      # Uses get_end_date() → yesterday, so rolling averages are always complete.
      - name: Run Feature Pipeline (Historical / Training Path)
        env:
          MONGODB_URI: ${{ secrets.MONGO_CONNECTION_STRING }}
        run: |
          python run_feature_pipeline.py

      # ── FAST PATH: real-time dashboard update ────────────────────────────────
      # Fetches last ~6 hours (including today's partial data) and writes to
      # `realtime_observations` (TTL-indexed, self-cleaning, never touches
      # processed_features so training data is 100% safe).
      - name: Run Realtime Update (Dashboard Path)
        env:
          MONGODB_URI: ${{ secrets.MONGO_CONNECTION_STRING }}
        run: |
          python update_realtime.py